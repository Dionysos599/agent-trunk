<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="How many redos does the merge queue need?">
<rect width="760" height="380" fill="#ffffff" rx="8"/>
<text x="24" y="32" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1f2933">How many redos does the merge queue need?</text>
<text x="24" y="52" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52606d">Runs in which all 5 racing tasks landed; a task that runs out of redos goes to a person</text>
<rect x="64" y="64" width="12" height="12" rx="2" fill="#4c78a8"/>
<text x="82" y="74" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933">counter (5 racing tasks)</text>
<rect x="262" y="64" width="12" height="12" rx="2" fill="#e45756"/>
<text x="280" y="74" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933">shared (5 racing tasks)</text>
<line x1="64" y1="324.0" x2="720" y2="324.0" stroke="#d9dee3"/>
<text x="56" y="328.0" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#52606d">0</text>
<line x1="64" y1="266.0" x2="720" y2="266.0" stroke="#d9dee3"/>
<text x="56" y="270.0" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#52606d">25</text>
<line x1="64" y1="208.0" x2="720" y2="208.0" stroke="#d9dee3"/>
<text x="56" y="212.0" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#52606d">50</text>
<line x1="64" y1="150.0" x2="720" y2="150.0" stroke="#d9dee3"/>
<text x="56" y="154.0" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#52606d">75</text>
<line x1="64" y1="92.0" x2="720" y2="92.0" stroke="#d9dee3"/>
<text x="56" y="96.0" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#52606d">100</text>
<text x="64.0" y="344" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#52606d">0</text>
<text x="173.3" y="344" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#52606d">1</text>
<text x="392.0" y="344" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#52606d">3</text>
<text x="720.0" y="344" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#52606d">6</text>
<text x="392.0" y="366" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52606d">redos allowed per task</text>
<text x="14" y="208.0" transform="rotate(-90 14 208.0)" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52606d">runs in which every task landed (%)</text>
<polyline points="64.0,324.0 173.3,324.0 392.0,231.2 720.0,92.0" fill="none" stroke="#4c78a8" stroke-width="2.5"/>
<circle cx="64.0" cy="324.0" r="4" fill="#4c78a8"><title>counter (5 racing tasks) at 0: 0%</title></circle>
<circle cx="173.3" cy="324.0" r="4" fill="#4c78a8"><title>counter (5 racing tasks) at 1: 0%</title></circle>
<circle cx="392.0" cy="231.2" r="4" fill="#4c78a8"><title>counter (5 racing tasks) at 3: 40%</title></circle>
<circle cx="720.0" cy="92.0" r="4" fill="#4c78a8"><title>counter (5 racing tasks) at 6: 100%</title></circle>
<polyline points="64.0,324.0 173.3,324.0 392.0,231.2 720.0,92.0" fill="none" stroke="#e45756" stroke-width="2.5"/>
<circle cx="64.0" cy="324.0" r="4" fill="#e45756"><title>shared (5 racing tasks) at 0: 0%</title></circle>
<circle cx="173.3" cy="324.0" r="4" fill="#e45756"><title>shared (5 racing tasks) at 1: 0%</title></circle>
<circle cx="392.0" cy="231.2" r="4" fill="#e45756"><title>shared (5 racing tasks) at 3: 40%</title></circle>
<circle cx="720.0" cy="92.0" r="4" fill="#e45756"><title>shared (5 racing tasks) at 6: 100%</title></circle>
</svg>
