[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrunk"
version = "1.0.0"
description = "A strongly consistent shared trunk for several AI agents working on one code base"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agenttrunk = "cmws_ws.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
